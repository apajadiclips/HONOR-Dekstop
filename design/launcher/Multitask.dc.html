<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Multitasking</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#CFE0FF}a:hover{color:#FFFFFF}
button{font-family:inherit}
.glass{background:rgba(18,26,44,0.42);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);border:1px solid rgba(255,255,255,0.28);box-shadow:inset 0 1px 0 rgba(255,255,255,0.45),inset 0 -1px 0 rgba(255,255,255,0.08),0 18px 50px rgba(0,0,0,0.35)}
.glass-lite{background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.18);box-shadow:inset 0 1px 0 rgba(255,255,255,0.30)}
</style>
</helmet>
<div style="width: 1333px; height: 800px; position: relative; overflow: hidden; background: #0B1426; font-family: Inter, system-ui, sans-serif; color: #FFFFFF">

<svg aria-hidden="true" width="1333" height="800" viewBox="0 0 1333 800" style="position: absolute; inset: 0">
<defs><filter id="mt-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"></feGaussianBlur></filter></defs>
<g filter="url(#mt-blur)">
<circle cx="220" cy="560" r="230" fill="#2F5BFF"></circle>
<circle cx="700" cy="180" r="220" fill="#8A4DFF"></circle>
<circle cx="1160" cy="520" r="210" fill="#12A99B"></circle>
<circle cx="1100" cy="120" r="150" fill="#FF7A45"></circle>
</g>
</svg>

<div class="glass" style="position: absolute; left: 50%; top: 20px; transform: translateX(-50%); border-radius: 22px; padding: 12px; display: flex; gap: 12px">
<sc-for list="{{desks}}" as="d" hint-placeholder-count="3">
<button onClick="{{d.pick}}" aria-pressed="{{d.pressed}}" style="all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 6px; align-items: center">
<span style="width: 150px; height: 86px; border-radius: 12px; border: {{d.ring}}; background: {{d.bg}}; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #FFFFFF; box-sizing: border-box">{{d.thumb}}</span>
<span style="font-size: 12px; font-weight: 500">{{d.label}}</span>
</button>
</sc-for>
</div>

<div class="glass" style="position: absolute; left: 50%; top: 190px; transform: translateX(-50%); width: 900px; border-radius: 28px; padding: 22px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 15px; font-weight: 600">Penukar tugas</span>
<span style="font-size: 12px; color: #E4EAF5">Alt + Tab: tukar tetingkap · Win + Tab: desktop maya</span>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{windows}}" as="w" hint-placeholder-count="4">
<button onClick="{{w.pick}}" aria-pressed="{{w.pressed}}" style="all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 8px; padding: 8px; border-radius: 16px; background: {{w.sel}}">
<span style="display: block; height: 120px; border-radius: 10px; background: {{w.preview}}; overflow: hidden; box-shadow: 0 6px 18px rgba(0,0,0,0.3)">
<span style="display: block; height: 18px; background: rgba(0,0,0,0.12)"></span>
<span style="display: block; margin: 12px 12px 0; height: 8px; width: 60%; border-radius: 4px; background: rgba(0,0,0,0.14)"></span>
<span style="display: block; margin: 8px 12px 0; height: 8px; width: 40%; border-radius: 4px; background: rgba(0,0,0,0.14)"></span>
</span>
<span style="display: flex; align-items: center; gap: 8px">
<span style="width: 24px; height: 24px; border-radius: 7px; background: {{w.bg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{w.icon}}"></path></svg>
</span>
<span style="font-size: 13px; font-weight: 500">{{w.name}}</span>
</span>
</button>
</sc-for>
</div>
</div>

<div class="glass" style="position: absolute; left: 16px; bottom: 76px; width: 360px; border-radius: 24px; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 15px; font-weight: 600">Sejarah papan klip</span>
<span style="font-size: 12px; color: #E4EAF5">Win + V</span>
</div>
<sc-for list="{{clips}}" as="c" hint-placeholder-count="3">
<div class="glass-lite" style="border-radius: 14px; padding: 10px 12px; display: flex; align-items: center; gap: 10px">
<span style="display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0">
<span style="font-size: 11px; color: #E4EAF5">{{c.kind}}</span>
<span style="font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.text}}</span>
</span>
<button aria-label="Sematkan" style="all: unset; cursor: pointer; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l-1 6l3 3H7l3-3zM12 13v7"></path></svg>
</button>
</div>
</sc-for>
</div>

<div class="glass" style="position: absolute; left: 0; right: 0; bottom: 0; height: 60px; border-radius: 0; border-left: 0; border-right: 0; border-bottom: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; box-sizing: border-box">
<div style="display: flex; align-items: center; gap: 6px; width: 300px">
<sc-for list="{{desks}}" as="v" hint-placeholder-count="3">
<button onClick="{{v.pick}}" aria-label="{{v.label}}" style="min-width: 44px; height: 34px; border-radius: 17px; border: 1px solid rgba(255,255,255,0.25); background: {{v.pill}}; color: #FFFFFF; font-size: 13px; font-weight: 600; cursor: pointer">{{v.n}}</button>
</sc-for>
<span style="font-size: 12px; color: #E4EAF5; margin-left: 4px">{{deskName}}</span>
</div>
<div style="display: flex; align-items: center; gap: 6px">
<button aria-label="Menu Mula" style="width: 48px; height: 48px; border: 0; border-radius: 12px; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="#FFFFFF"><circle cx="6" cy="6" r="2.2"></circle><circle cx="12" cy="6" r="2.2"></circle><circle cx="18" cy="6" r="2.2"></circle><circle cx="6" cy="12" r="2.2"></circle><circle cx="12" cy="12" r="2.2"></circle><circle cx="18" cy="12" r="2.2"></circle><circle cx="6" cy="18" r="2.2"></circle><circle cx="12" cy="18" r="2.2"></circle><circle cx="18" cy="18" r="2.2"></circle></svg>
</button>
<sc-for list="{{windows}}" as="app" hint-placeholder-count="4">
<button onClick="{{app.pick}}" aria-label="{{app.name}}" style="width: 48px; height: 48px; border: 0; border-radius: 12px; background: transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
<span style="width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: {{app.bg}}">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{app.icon}}"></path></svg>
</span>
<span style="width: {{app.dot}}; height: 3px; border-radius: 2px; background: #FFFFFF"></span>
</button>
</sc-for>
</div>
<div style="display: flex; align-items: center; justify-content: flex-end; gap: 12px; width: 300px; font-size: 12px">
<span class="glass-lite" style="display: flex; gap: 10px; padding: 6px 10px; border-radius: 14px"><span>RAM 3.1/4 GB</span><span>CPU 24%</span></span>
<span>33%</span>
<span style="display: flex; flex-direction: column; align-items: flex-end; line-height: 1.35"><span>3:57 PTG</span><span style="color: #E4EAF5">21/11/2026</span></span>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1333,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { win: 1, desk: 0 };
  }
  renderVals() {
    const I = {
      folder: 'M3 7h6l2 2h10v10H3z',
      globe: 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18',
      shield: 'M12 3l8 3v6c0 5-4 8-8 9c-4-1-8-4-8-9V6zM9 12l2 2l4-4',
      note: 'M6 3h9l4 4v14H6zM9 12h7M9 16h7M9 8h3'
    };
    const win = this.state.win;
    const desk = this.state.desk;
    const W = [
      { name: 'Fail', icon: I.folder, bg: '#C7682B', preview: '#F4F6FA' },
      { name: 'Pelayar', icon: I.globe, bg: '#2F6FE0', preview: '#FFFFFF' },
      { name: 'Debloat Manager', icon: I.shield, bg: '#2E8B4E', preview: '#E7F3EC' },
      { name: 'Nota', icon: I.note, bg: '#7550C9', preview: '#F1ECFB' }
    ];
    const D = [
      { n: '1', label: 'Kerja', thumb: '', bg: 'rgba(47,91,255,0.55)' },
      { n: '2', label: 'Hiburan', thumb: '', bg: 'rgba(138,77,255,0.55)' },
      { n: '+', label: 'Desktop baharu', thumb: '+', bg: 'rgba(255,255,255,0.08)' }
    ];
    return {
      deskName: 'Desktop ' + (desk + 1) + ' · ' + (D[desk] ? D[desk].label : ''),
      windows: W.map((w, i) => ({
        ...w,
        pressed: i === win ? 'true' : 'false',
        sel: i === win ? 'rgba(255,255,255,0.22)' : 'transparent',
        dot: i === win ? '14px' : '6px',
        pick: () => this.setState({ win: i })
      })),
      desks: D.map((d, i) => ({
        ...d,
        label: i < 2 ? 'Desktop ' + d.n + ' · ' + d.label : d.label,
        pressed: i === desk ? 'true' : 'false',
        ring: i === desk ? '2px solid #FFFFFF' : '1px solid rgba(255,255,255,0.25)',
        pill: i === desk ? 'rgba(255,255,255,0.30)' : 'transparent',
        pick: () => { if (i < 2) this.setState({ desk: i }); }
      })),
      clips: [
        { kind: 'Teks · 1 min lalu', text: 'pm disable-user --user 0 com.facebook.appmanager' },
        { kind: 'Pautan · 8 min lalu', text: 'dns.adguard-dns.com' },
        { kind: 'Teks · Semalam', text: './hdm restore --all' }
      ]
    };
  }
}
</script>
</body>
</html>
