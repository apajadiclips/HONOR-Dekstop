<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Ruangan Game</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}
button{font-family:inherit}
.glass{background:rgba(14,14,30,0.46);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);border:1px solid rgba(255,255,255,0.26);box-shadow:inset 0 1px 0 rgba(255,255,255,0.42),inset 0 -1px 0 rgba(255,255,255,0.08),0 18px 50px rgba(0,0,0,0.35)}
.glass-lite{background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.18);box-shadow:inset 0 1px 0 rgba(255,255,255,0.30)}
input[type=checkbox]{accent-color:#FF2E88;width:18px;height:18px}
</style>
</helmet>
<div style="width: 1333px; height: 800px; position: relative; overflow: hidden; background: #0A0A18; font-family: Inter, system-ui, sans-serif; color: #FFFFFF">
<svg aria-hidden="true" width="1333" height="800" viewBox="0 0 1333 800" style="position: absolute; inset: 0">
<defs><filter id="gm-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="80"></feGaussianBlur></filter></defs>
<g filter="url(#gm-blur)">
<circle cx="300" cy="650" r="230" fill="#7A2CFF"></circle>
<circle cx="820" cy="160" r="220" fill="#FF2E88"></circle>
<circle cx="1220" cy="560" r="200" fill="#00D1FF"></circle>
</g>
</svg>

<nav class="glass" aria-label="Ruangan" style="position: absolute; left: 16px; top: 16px; bottom: 16px; width: 220px; border-radius: 24px; padding: 18px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; color: #E6E3F5; padding: 0 10px 8px">Ruangan</span>
<a href="Game.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 12px; background: rgba(255,255,255,0.22); text-decoration: none; font-size: 14px; font-weight: 600">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9h12a4 4 0 0 1 0 8c-2 0-3-2-4-2h-4c-1 0-2 2-4 2a4 4 0 0 1 0-8zM8 11v4M6 13h4M16 12h.01M18 14h.01"></path></svg>Game</a>
<a href="Sosial.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 14px">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"></path></svg>Media Sosial</a>
<a href="Hiburan.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 14px">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4zM10 9l5 3l-5 3z"></path></svg>Hiburan</a>
<div class="glass-lite" style="margin-top: auto; border-radius: 16px; padding: 12px; font-size: 12px; line-height: 1.5">
<div style="font-weight: 600; font-size: 13px">Wallpaper ruangan</div>
<div style="color: #E6E3F5">Neon · ditukar automatik bila masuk ruangan ini</div>
</div>
</nav>

<div style="position: absolute; left: 256px; right: 16px; top: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 26px; font-weight: 700">Ruangan Game</span>
<span style="font-size: 13px; color: #E6E3F5">Semua game anda di satu tempat, dengan mod prestasi</span>
</span>
<button onClick="{{toggle}}" aria-pressed="{{pressed}}" class="glass" style="min-height: 44px; padding: 0 18px; border-radius: 22px; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px">
<span style="width: 10px; height: 10px; border-radius: 5px; background: {{dot}}"></span>Mod Game: {{modeText}}</button>
</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{meters}}" as="m" hint-placeholder-count="4">
<div class="glass" style="border-radius: 20px; padding: 14px 16px">
<div style="font-size: 12px; color: #E6E3F5">{{m.label}}</div>
<div style="font-size: 26px; font-weight: 700; margin-top: 4px">{{m.value}}</div>
<div style="font-size: 12px; color: #E6E3F5">{{m.sub}}</div>
</div>
</sc-for>
</div>

<div style="display: flex; gap: 14px; flex: 1; min-height: 0">
<div class="glass" style="flex: 1; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 15px; font-weight: 600">Perpustakaan game</span>
<span style="font-size: 12px; color: #E6E3F5">Disusun ikut main terakhir</span>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{games}}" as="g" hint-placeholder-count="8">
<button style="all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: flex-end; height: 118px; border-radius: 16px; background: {{g.art}}; padding: 10px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.2)">
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{g.icon}}"></path></svg>
</span>
<span style="font-size: 13px; font-weight: 600">{{g.name}}</span>
<span style="font-size: 11px; color: #E6E3F5">{{g.last}}</span>
</button>
</sc-for>
</div>
</div>

<div class="glass" style="width: 300px; border-radius: 24px; padding: 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 15px; font-weight: 600">Tetapan mod game</span>
<sc-for list="{{opts}}" as="o" hint-placeholder-count="6">
<label style="display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 36px; font-size: 13px">
<span style="display: flex; flex-direction: column; gap: 2px"><span>{{o.name}}</span><span style="font-size: 11px; color: #E6E3F5">{{o.hint}}</span></span>
<input type="checkbox" checked="{{o.on}}">
</label>
</sc-for>
<button style="margin-top: auto; min-height: 46px; border: 0; border-radius: 14px; background: #FF2E88; color: #1A0614; font-size: 14px; font-weight: 700; cursor: pointer">Tutup aplikasi latar &amp; main</button>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1333,"height":800}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { on: true }; }
  renderVals() {
    const on = this.state.on;
    const pad = 'M6 9h12a4 4 0 0 1 0 8c-2 0-3-2-4-2h-4c-1 0-2 2-4 2a4 4 0 0 1 0-8z';
    return {
      toggle: () => this.setState({ on: !on }),
      pressed: on ? 'true' : 'false',
      modeText: on ? 'Aktif' : 'Mati',
      dot: on ? '#5CF29A' : '#9A97B0',
      meters: [
        { label: 'Kadar bingkai', value: '60 FPS', sub: 'Contoh semasa main' },
        { label: 'Suhu', value: '38°C', sub: 'Normal' },
        { label: 'RAM tersedia', value: '1.2 GB', sub: 'daripada 4 GB' },
        { label: 'Bateri', value: '33%', sub: '~1 j 50 min main' }
      ],
      games: [
        { name: 'Aksi', last: '2 jam lalu', art: '#7A2CFF', icon: pad },
        { name: 'Lumba', last: 'Semalam', art: '#C2185B', icon: 'M5 17h14l-2-6H7zM7 17v2M17 17v2M8 14h.01M16 14h.01' },
        { name: 'Teka-teki', last: '2 hari lalu', art: '#00838F', icon: 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z' },
        { name: 'Strategi', last: '3 hari lalu', art: '#2F5BFF', icon: 'M12 3l3 6l6 1l-4.5 4l1 6L12 17l-5.5 3l1-6L3 10l6-1z' },
        { name: 'Sukan', last: 'Minggu lalu', art: '#2E7D32', icon: 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18M3 12h18M12 3v18' },
        { name: 'RPG', last: 'Minggu lalu', art: '#6D4C41', icon: 'M14 4l6 6l-9 9H5v-6z' },
        { name: 'Kasual', last: 'Bulan lalu', art: '#E65100', icon: 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18M8 14c1 2 7 2 8 0M9 9h.01M15 9h.01' },
        { name: 'Tambah game', last: 'Imbas aplikasi', art: 'rgba(255,255,255,0.10)', icon: 'M12 5v14M5 12h14' }
      ],
      opts: [
        { name: 'Prestasi maksimum', hint: 'Guna lebih bateri', on: true },
        { name: 'Senyapkan notifikasi', hint: 'Kecuali panggilan', on: true },
        { name: 'Kunci kecerahan', hint: 'Elak skrin malap', on: true },
        { name: 'Elak sentuhan tepi', hint: 'Tapis sentuhan tak sengaja', on: true },
        { name: 'Sekat iklan (DNS)', hint: 'Ikut tetapan Debloat Manager', on: true },
        { name: 'Rakam gameplay', hint: 'Simpan 30 saat terakhir', on: false }
      ]
    };
  }
}
</script>
</body>
</html>
