<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Wallpaper Kustom</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#CFE0FF}a:hover{color:#FFFFFF}
button{font-family:inherit}
.glass{background:rgba(18,26,44,0.42);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);border:1px solid rgba(255,255,255,0.28);box-shadow:inset 0 1px 0 rgba(255,255,255,0.45),inset 0 -1px 0 rgba(255,255,255,0.08),0 18px 50px rgba(0,0,0,0.35)}
.glass-lite{background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.18);box-shadow:inset 0 1px 0 rgba(255,255,255,0.30)}
input[type=range]{accent-color:#FFFFFF}
input[type=checkbox]{accent-color:#2F6FE0;width:18px;height:18px}
</style>
</helmet>
<div style="width: 1333px; height: 800px; position: relative; overflow: hidden; background: #0E1626; font-family: Inter, system-ui, sans-serif; color: #FFFFFF; display: flex; gap: 24px; padding: 24px; box-sizing: border-box">

<div style="flex: 1; display: flex; flex-direction: column; gap: 16px; min-width: 0">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 24px; font-weight: 600">Wallpaper</span>
<span style="font-size: 13px; color: #B8C4D8">Pratonton langsung · {{name}}</span>
</div>

<div style="position: relative; height: 520px; border-radius: 18px; overflow: hidden; background: {{p.base}}">
<sc-if value="{{isCustom}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: #2A3447; color: #D5DDEA">
<svg aria-hidden="true" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#D5DDEA" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4zM4 16l5-5l4 4l3-3l4 4M15 9h.01"></path></svg>
<span style="font-size: 16px; font-weight: 600">[Gambar anda dari Galeri]</span>
<span style="font-size: 13px">Potong &amp; laraskan kedudukan selepas memilih</span>
</div>
</sc-if>
<sc-if value="{{isPreset}}" hint-placeholder-val="{{ true }}">
<svg aria-hidden="true" width="100%" height="100%" viewBox="0 0 860 520" preserveAspectRatio="xMidYMid slice" style="position: absolute; inset: 0">
<defs><filter id="wp-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"></feGaussianBlur></filter></defs>
<g filter="url(#wp-blur)">
<circle cx="170" cy="140" r="150" fill="{{p.c1}}"></circle>
<circle cx="480" cy="400" r="170" fill="{{p.c2}}"></circle>
<circle cx="740" cy="110" r="140" fill="{{p.c3}}"></circle>
<circle cx="760" cy="420" r="110" fill="{{p.c4}}"></circle>
</g>
</svg>
</sc-if>
<div style="position: absolute; inset: 0; background: {{dim}}"></div>

<div class="glass" style="position: absolute; right: 20px; top: 20px; width: 230px; border-radius: 20px; padding: 14px 16px">
<div style="font-size: 32px; font-weight: 600">3:57</div>
<div style="font-size: 12px; color: #E4EAF5">Sabtu, 21 November</div>
</div>
<div class="glass" style="position: absolute; left: 20px; top: 20px; width: 260px; border-radius: 18px; padding: 12px 14px; display: flex; gap: 10px; align-items: center">
<span style="width: 30px; height: 30px; border-radius: 9px; background: #2E8B4E; flex-shrink: 0"></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; font-weight: 600">Contoh notifikasi</span><span style="font-size: 12px; color: #E4EAF5">Kaca mengikut warna wallpaper</span></span>
</div>
<div class="glass" style="position: absolute; left: 0; right: 0; bottom: 0; height: 46px; border-radius: 0; border-left: 0; border-right: 0; border-bottom: 0; display: flex; align-items: center; justify-content: center; gap: 10px">
<span style="width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,0.85)"></span>
<span style="width: 28px; height: 28px; border-radius: 8px; background: #C7682B"></span>
<span style="width: 28px; height: 28px; border-radius: 8px; background: #2F6FE0"></span>
<span style="width: 28px; height: 28px; border-radius: 8px; background: #2E8B4E"></span>
<span style="width: 28px; height: 28px; border-radius: 8px; background: {{p.accent}}"></span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 600">Wallpaper setiap desktop maya</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{perDesk}}" as="d" hint-placeholder-count="3">
<div style="height: 96px; border-radius: 12px; background: {{d.bg}}; border: 1px solid rgba(255,255,255,0.2); position: relative; overflow: hidden">
<span style="position: absolute; left: 10px; bottom: 8px; font-size: 12px; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,0.6)">{{d.label}}</span>
</div>
</sc-for>
</div>
</div>
</div>

<div style="width: 400px; background: #162033; border: 1px solid #26354F; border-radius: 20px; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
<span style="font-size: 15px; font-weight: 600">Pilih wallpaper</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{presets}}" as="w" hint-placeholder-count="6">
<button onClick="{{w.pick}}" aria-pressed="{{w.pressed}}" style="all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 6px">
<span style="display: block; height: 70px; border-radius: 12px; background: {{w.thumb}}; border: {{w.ring}}; box-sizing: border-box"></span>
<span style="font-size: 12px; text-align: center; color: #E3E9F2">{{w.name}}</span>
</button>
</sc-for>
</div>
<div style="display: flex; gap: 8px">
<button onClick="{{pickCustom}}" style="flex: 1; min-height: 44px; border: 0; border-radius: 12px; background: #2F6FE0; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer">Pilih dari Galeri</button>
<button style="flex: 1; min-height: 44px; border: 1px solid #33496B; border-radius: 12px; background: transparent; color: #FFFFFF; font-size: 14px; cursor: pointer">Ambil gambar</button>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; font-size: 13px">
<label style="display: flex; align-items: center; gap: 10px"><span style="width: 120px">Kabur kaca</span><input type="range" min="0" max="100" value="60" style="flex: 1"></label>
<label style="display: flex; align-items: center; gap: 10px"><span style="width: 120px">Kegelapan</span><input type="range" min="0" max="100" value="25" style="flex: 1"></label>
</div>
<div style="display: flex; flex-direction: column; gap: 12px; font-size: 13px">
<label style="display: flex; align-items: center; justify-content: space-between; min-height: 32px">Warna aksen ikut wallpaper<input type="checkbox" checked></label>
<label style="display: flex; align-items: center; justify-content: space-between; min-height: 32px">Berbeza setiap desktop maya<input type="checkbox" checked></label>
<label style="display: flex; align-items: center; justify-content: space-between; min-height: 32px">Tukar automatik setiap hari<input type="checkbox"></label>
<label style="display: flex; align-items: center; justify-content: space-between; min-height: 32px">Kesan paralaks (guna lebih bateri)<input type="checkbox"></label>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; margin-top: auto">
<span style="font-size: 12px; color: #B8C4D8">Guna pada</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; background: #0F1828; padding: 4px; border-radius: 12px">
<button style="min-height: 38px; border: 0; border-radius: 9px; background: transparent; color: #E3E9F2; font-size: 13px; cursor: pointer">Desktop</button>
<button style="min-height: 38px; border: 0; border-radius: 9px; background: transparent; color: #E3E9F2; font-size: 13px; cursor: pointer">Skrin kunci</button>
<button aria-pressed="true" style="min-height: 38px; border: 0; border-radius: 9px; background: #2A3B58; color: #FFFFFF; font-size: 13px; font-weight: 600; cursor: pointer">Kedua-dua</button>
</div>
<button style="min-height: 48px; border: 0; border-radius: 12px; background: #FFFFFF; color: #0E1626; font-size: 15px; font-weight: 600; cursor: pointer">Guna wallpaper</button>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1333,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 0 };
  }
  renderVals() {
    const P = [
      { name: 'Aurora', base: '#0B1426', c1: '#2F5BFF', c2: '#8A4DFF', c3: '#12A99B', c4: '#FF7A45', accent: '#5B9BFF' },
      { name: 'Senja', base: '#2A1020', c1: '#FF6B4A', c2: '#C2417A', c3: '#FFB347', c4: '#6B2FBF', accent: '#FF8A5C' },
      { name: 'Lautan', base: '#04202B', c1: '#0E7C9A', c2: '#2F5BFF', c3: '#19C3B4', c4: '#0B4F6C', accent: '#3CC8D6' },
      { name: 'Hutan', base: '#0C1E14', c1: '#2E8B4E', c2: '#13695A', c3: '#7FD46A', c4: '#C9B44A', accent: '#7FD46A' },
      { name: 'Neon', base: '#0A0A18', c1: '#FF2E88', c2: '#7A2CFF', c3: '#00D1FF', c4: '#FFD000', accent: '#FF5FA8' }
    ];
    const sel = this.state.sel;
    const custom = sel === P.length;
    const p = custom ? { name: 'Kustom', base: '#2A3447', c1: '#000', c2: '#000', c3: '#000', c4: '#000', accent: '#9AA8BF' } : P[sel];
    const thumb = (x) => 'radial-gradient(circle at 25% 30%, ' + x.c1 + ' 0, transparent 55%), radial-gradient(circle at 75% 70%, ' + x.c2 + ' 0, transparent 55%), radial-gradient(circle at 85% 20%, ' + x.c3 + ' 0, transparent 45%), ' + x.base;
    const ring = (on) => on ? '2px solid #FFFFFF' : '1px solid rgba(255,255,255,0.18)';
    const presets = P.map((x, i) => ({
      name: x.name, thumb: thumb(x), ring: ring(i === sel), pressed: i === sel ? 'true' : 'false',
      pick: () => this.setState({ sel: i })
    }));
    presets.push({ name: 'Kustom', thumb: 'repeating-linear-gradient(45deg, #2A3447 0 8px, #323D52 8px 16px)', ring: ring(custom), pressed: custom ? 'true' : 'false', pick: () => this.setState({ sel: P.length }) });
    return {
      p,
      name: p.name,
      isCustom: custom,
      isPreset: !custom,
      dim: 'rgba(0,0,0,0.12)',
      presets,
      pickCustom: () => this.setState({ sel: P.length }),
      perDesk: [
        { label: 'Desktop 1 · Kerja', bg: custom ? '#2A3447' : thumb(p) },
        { label: 'Desktop 2 · Hiburan', bg: thumb(P[(sel + 1) % P.length]) },
        { label: 'Desktop 3 · Game', bg: thumb(P[4]) }
      ]
    };
  }
}
</script>
</body>
</html>
