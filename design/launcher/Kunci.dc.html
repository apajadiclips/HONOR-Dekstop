<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Skrin Kunci Liquid Glass</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
.glass{background:rgba(18,26,44,0.40);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);border:1px solid rgba(255,255,255,0.28);box-shadow:inset 0 1px 0 rgba(255,255,255,0.45),inset 0 -1px 0 rgba(255,255,255,0.08),0 18px 50px rgba(0,0,0,0.35)}
</style>
</helmet>
<div style="width: 1333px; height: 800px; position: relative; overflow: hidden; background: #2A1020; font-family: Inter, system-ui, sans-serif; color: #FFFFFF">

<svg aria-hidden="true" width="1333" height="800" viewBox="0 0 1333 800" style="position: absolute; inset: 0">
<defs><filter id="lk-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="80"></feGaussianBlur></filter></defs>
<g filter="url(#lk-blur)">
<circle cx="240" cy="220" r="240" fill="#FF6B4A"></circle>
<circle cx="760" cy="640" r="260" fill="#C2417A"></circle>
<circle cx="1160" cy="200" r="210" fill="#FFB347"></circle>
<circle cx="1150" cy="650" r="180" fill="#6B2FBF"></circle>
</g>
</svg>
<div style="position: absolute; inset: 0; background: rgba(0,0,0,0.18)"></div>

<div style="position: absolute; left: 24px; right: 24px; top: 18px; display: flex; justify-content: space-between; font-size: 13px; font-weight: 500">
<span>HONOR Pad X9</span>
<span style="display: flex; gap: 14px; align-items: center">
<svg role="img" aria-label="Wi-Fi" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"><path d="M2 9a15 15 0 0 1 20 0M5 13a10 10 0 0 1 14 0M8.5 16.5a5 5 0 0 1 7 0M12 20h.01"></path></svg>
<span>33% · Mengecas</span>
</span>
</div>

<div style="position: absolute; left: 80px; top: 120px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 20px; font-weight: 500">Sabtu, 21 November</span>
<span style="font-size: 168px; font-weight: 300; line-height: 1; letter-spacing: -6px">3:57</span>
<div style="display: flex; gap: 12px; margin-top: 18px">
<div class="glass" style="border-radius: 20px; padding: 14px 18px; width: 170px">
<div style="font-size: 12px; color: #F2E6EC">Cuaca</div>
<div style="font-size: 26px; font-weight: 600; margin-top: 4px">[--°C]</div>
<div style="font-size: 12px; color: #F2E6EC">[Lokasi]</div>
</div>
<div class="glass" style="border-radius: 20px; padding: 14px 18px; width: 170px">
<div style="font-size: 12px; color: #F2E6EC">Bateri</div>
<div style="font-size: 26px; font-weight: 600; margin-top: 4px">33%</div>
<div style="font-size: 12px; color: #F2E6EC">Penuh dalam ~1 j 40 min</div>
</div>
<div class="glass" style="border-radius: 20px; padding: 14px 18px; width: 170px">
<div style="font-size: 12px; color: #F2E6EC">Seterusnya</div>
<div style="font-size: 15px; font-weight: 600; margin-top: 6px">[Nama acara]</div>
<div style="font-size: 12px; color: #F2E6EC">4:30 PTG</div>
</div>
</div>
</div>

<div style="position: absolute; right: 64px; top: 120px; width: 380px; display: flex; flex-direction: column; gap: 10px">
<div class="glass" style="border-radius: 22px; padding: 14px; display: flex; align-items: center; gap: 12px">
<span style="width: 52px; height: 52px; border-radius: 14px; background: #8A4DFF; flex-shrink: 0; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13M9 18a3 3 0 1 1-6 0a3 3 0 1 1 6 0M20 16a3 3 0 1 1-6 0a3 3 0 1 1 6 0"></path></svg>
</span>
<span style="display: flex; flex-direction: column; gap: 2px; flex: 1"><span style="font-size: 14px; font-weight: 600">[Tajuk lagu]</span><span style="font-size: 12px; color: #F2E6EC">[Artis]</span></span>
<button aria-label="Jeda" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="#2A1020"><path d="M7 5h4v14H7zM13 5h4v14h-4z"></path></svg></button>
</div>
<sc-for list="{{notifs}}" as="n" hint-placeholder-count="3">
<div class="glass" style="border-radius: 20px; padding: 12px 14px; display: flex; gap: 12px; align-items: center">
<span style="width: 34px; height: 34px; border-radius: 10px; background: {{n.bg}}; flex-shrink: 0; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.icon}}"></path></svg>
</span>
<span style="display: flex; flex-direction: column; gap: 2px; flex: 1"><span style="font-size: 13px; font-weight: 600">{{n.app}}</span><span style="font-size: 12px; color: #F2E6EC">{{n.body}}</span></span>
<span style="font-size: 12px; color: #F2E6EC">{{n.when}}</span>
</div>
</sc-for>
<span style="font-size: 12px; color: #F2E6EC; text-align: center">Kandungan disembunyikan sehingga dibuka kunci</span>
</div>

<button aria-label="Lampu suluh" class="glass" style="position: absolute; left: 48px; bottom: 40px; width: 56px; height: 56px; border-radius: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8v4l-2 3v11h-4V10L8 7zM12 13v2"></path></svg>
</button>
<button aria-label="Kamera" class="glass" style="position: absolute; right: 48px; bottom: 40px; width: 56px; height: 56px; border-radius: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h4l2-3h4l2 3h4v11H4zM12 10a3.5 3.5 0 1 0 0 7a3.5 3.5 0 1 0 0-7"></path></svg>
</button>
<div style="position: absolute; left: 50%; bottom: 36px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 10px">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11V8a5 5 0 0 1 10 0v3M5 11h14v10H5z"></path></svg>
<span style="font-size: 14px; font-weight: 500">Leret ke atas atau guna cap jari untuk buka</span>
<span style="width: 140px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.85)"></span>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1333,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      notifs: [
        { app: 'Debloat Manager', body: 'Backup mingguan selesai', when: '2 min', bg: '#2E8B4E', icon: 'M12 3l8 3v6c0 5-4 8-8 9c-4-1-8-4-8-9V6zM9 12l2 2l4-4' },
        { app: 'Mesej', body: '2 mesej baharu', when: '15 min', bg: '#7550C9', icon: 'M4 5h16v11H9l-5 4z' },
        { app: 'E-mel', body: '1 e-mel baharu', when: '1 j', bg: '#2F6FE0', icon: 'M3 6h18v12H3zM3 7l9 6l9-6' }
      ]
    };
  }
}
</script>
</body>
</html>
